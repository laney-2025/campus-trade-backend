<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>校园二手交易后台</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui/lib/theme-chalk/index.css">
    <script src="https://cdn.jsdelivr.net/npm/element-ui/lib/index.js"></script>
</head>
<body>
<div id="app">
    <el-menu mode="horizontal">
        <el-menu-item index="1" @click="activeTab='product'">商品管理</el-menu-item>
        <el-menu-item index="2" @click="activeTab='order'">订单管理</el-menu-item>
        <el-menu-item index="3" @click="activeTab='report'">举报审核</el-menu-item>
    </el-menu>

    <!--商品列表-->
    <div v-if="activeTab==='product'">
        <h3>商品列表</h3>
        <el-table :data="productList" border>
            <el-table-column prop="id" label="ID"></el-table-column>
            <el-table-column prop="title" label="商品名"></el-table-column>
            <el-table-column prop="price" label="价格"></el-table-column>
            <el-table-column prop="status" label="状态">
                <template slot-scope="scope">
                    <span v-if="scope.row.status===0">待审核</span>
                    <span v-if="scope.row.status===1">已上架</span>
                    <span v-if="scope.row.status===2">下架</span>
                </template>
            </el-table-column>
            <el-table-column label="操作">
                <template slot-scope="scope">
                    <el-button size="mini" @click="auditProduct(scope.row.id,1)">通过上架</el-button>
                    <el-button size="mini" type="danger" @click="auditProduct(scope.row.id,3)">驳回</el-button>
                </template>
            </el-table-column>
        </el-table>
    </div>

    <!--举报管理、订单管理类似，省略-->
</div>
<script>
    var vm = new Vue({
        el:'#app',
        data(){
            return{
                activeTab:'product',
                productList:[]
            }
        },
        mounted(){
            this.loadProduct()
        },
        methods:{
            loadProduct(){
                axios.get('/admin/product/list?pageNum=1&pageSize=10').then(res=>{
                    this.productList = res.data.data.records
                })
            },
            auditProduct(id,status){
                axios.put(`/admin/product/audit/${id}?status=${id}`).then(()=>{
                    this.$message.success("操作成功");this.loadProduct()
                })
            }
        }
    })
</script>
</body>
</html>
